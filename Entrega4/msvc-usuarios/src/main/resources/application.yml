spring:
  application:
    name: msvc-usuarios
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/ticketya_usuarios
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      httpclient:
        enabled: true

server:
  port: 8081

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
