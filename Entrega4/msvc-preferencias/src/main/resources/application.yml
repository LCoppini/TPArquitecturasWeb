spring:
  application:
    name: msvc-preferencias
  config:
    import: optional:configserver:http://localhost:8888
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:27017/ticketya_preferencias
  cloud:
    openfeign:
      httpclient:
        enabled: true

server:
  port: 8086

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
