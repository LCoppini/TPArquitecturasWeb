spring:
  application:
    name: msvc-notificaciones
  config:
    import: optional:configserver:http://localhost:8888
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:27017/ticketya_notificaciones
  cloud:
    openfeign:
      httpclient:
        enabled: true
  # SMTP real (p. ej. Mailtrap). Descomentar al implementar el envio; credenciales por variables de entorno.
  # mail:
  #   host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
  #   port: ${MAIL_PORT:2525}
  #   username: ${MAIL_USER:}
  #   password: ${MAIL_PASSWORD:}

server:
  port: 8085

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
