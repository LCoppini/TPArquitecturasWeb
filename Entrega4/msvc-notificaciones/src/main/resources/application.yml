spring:
  application:
    name: msvc-notificaciones
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/ticketya_notificaciones
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      httpclient:
        enabled: true
  # SMTP real (p. ej. Mailtrap). Descomentar al implementar el envio; credenciales por variables de entorno.
  # mail:
  #   host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
  #   port: ${MAIL_PORT:2525}
  #   username: ${MAIL_USER:}
  #   password: ${MAIL_PASSWORD:}

server:
  port: 8085

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
