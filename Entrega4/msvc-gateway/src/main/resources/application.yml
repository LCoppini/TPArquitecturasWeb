spring:
  application:
    name: msvc-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      mvc:
        routes:
          - id: usuarios-route
            uri: lb://msvc-usuarios
            predicates:
              - Path=/api/usuarios/**
          - id: roles-route
            uri: lb://msvc-usuarios
            predicates:
              - Path=/api/roles/**
          - id: lugares-route
            uri: lb://msvc-ubicacion
            predicates:
              - Path=/api/lugares/**
          - id: sectores-route
            uri: lb://msvc-ubicacion
            predicates:
              - Path=/api/sectores/**
          - id: eventos-route
            uri: lb://msvc-evento
            predicates:
              - Path=/api/eventos/**
          - id: artistas-route
            uri: lb://msvc-evento
            predicates:
              - Path=/api/artistas/**
          - id: entradas-route
            uri: lb://msvc-entrada
            predicates:
              - Path=/api/entradas/**
          - id: pagos-route
            uri: lb://msvc-entrada
            predicates:
              - Path=/api/pagos/**

server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
