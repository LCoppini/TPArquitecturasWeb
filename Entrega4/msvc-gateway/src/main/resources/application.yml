spring:
  application:
    name: msvc-gateway
  config:
    import: optional:configserver:http://localhost:8888
  # E2 (EP-12): Resource Server JWT RS256. El emisor es msvc-usuarios (ADR-0001).
  # Sin estas variables el JwtDecoder no se construye: fail closed, sin volver
  # a la identidad simulada de Entrega 1.
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
          audiences: ${JWT_AUDIENCE}
          # `issuer-uri` dispararia discovery OIDC; la validacion de `iss` se
          # configura explicitamente en JwtDecoderValidatorPostProcessor.
          issuer: ${JWT_ISSUER}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Prefijos por rol se declaran antes que los generales.
            - id: admin-usuarios-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/admin/usuarios/**
            - id: admin-artistas-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/admin/artistas/**
            - id: organizador-eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/organizador/eventos/**
            - id: admin-eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/admin/eventos/**
            - id: admin-entradas-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/admin/entradas/**
            - id: accesos-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/accesos/**
            - id: usuarios-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/usuarios/**
            - id: roles-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/roles/**
            - id: lugares-route
              uri: lb://msvc-ubicacion
              predicates:
                - Path=/api/lugares/**
            - id: sectores-route
              uri: lb://msvc-ubicacion
              predicates:
                - Path=/api/sectores/**
            - id: eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/eventos/**
            - id: artistas-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/artistas/**
            - id: entradas-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/entradas/**
            - id: pagos-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/pagos/**
            - id: preferencias-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/preferencias/**
            - id: recomendaciones-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/recomendaciones/**

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
