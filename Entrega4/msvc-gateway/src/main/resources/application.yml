spring:
  application:
    name: msvc-gateway
  config:
    import: optional:configserver:http://localhost:8888
  # E2 (EP-12): Resource Server JWT. Plantilla local; se activa junto con la config central.
  # Descomentar cuando exista el emisor de tokens. Sin esas variables el gateway sigue
  # funcionando como en E1 (identidad simulada por headers X-User-*).
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         jwk-set-uri: ${JWT_JWK_SET_URI}
  #         audiences: ${JWT_AUDIENCE}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/usuarios/**
            - id: roles-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/roles/**
            - id: lugares-route
              uri: lb://msvc-ubicacion
              predicates:
                - Path=/api/lugares/**
            - id: sectores-route
              uri: lb://msvc-ubicacion
              predicates:
                - Path=/api/sectores/**
            - id: eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/eventos/**
            - id: artistas-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/artistas/**
            - id: entradas-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/entradas/**
            - id: pagos-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/pagos/**
            - id: preferencias-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/preferencias/**
            - id: recomendaciones-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/recomendaciones/**

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
