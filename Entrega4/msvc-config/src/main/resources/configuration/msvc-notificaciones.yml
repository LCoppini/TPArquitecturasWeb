server:
  port: 8085

spring:
  application:
    name: msvc-notificaciones
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:27017/ticketya_notificaciones
  cloud:
    openfeign:
      httpclient:
        enabled: true

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
