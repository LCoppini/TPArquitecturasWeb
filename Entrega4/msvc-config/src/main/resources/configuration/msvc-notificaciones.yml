server:
  port: 8085

spring:
  application:
    name: msvc-notificaciones
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/ticketya_notificaciones
    username: ${DB_USER:ticketya}
    password: ${DB_PASSWORD:ticketya}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # solo desarrollo; luego migrar a Flyway/Liquibase si el grupo lo decide
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      httpclient:
        enabled: true

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Solo health, sin detalles. El gateway lo deja fuera de la cadena con
# securityMatcher("/api/**", "/internal/**").
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
