server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: usuarios-route
            uri: lb://msvc-usuarios
            predicates:
              - Path=/api/usuarios/**
          - id: roles-route
            uri: lb://msvc-usuarios
            predicates:
              - Path=/api/roles/**
          - id: lugares-route
            uri: lb://msvc-ubicacion
            predicates:
              - Path=/api/lugares/**
          - id: sectores-route
            uri: lb://msvc-ubicacion
            predicates:
              - Path=/api/sectores/**
          - id: eventos-route
            uri: lb://msvc-evento
            predicates:
              - Path=/api/eventos/**
          - id: artistas-route
            uri: lb://msvc-evento
            predicates:
              - Path=/api/artistas/**
          - id: entradas-route
            uri: lb://msvc-entrada
            predicates:
              - Path=/api/entradas/**
          - id: pagos-route
            uri: lb://msvc-entrada
            predicates:
              - Path=/api/pagos/**

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

# E2: jwt.secret / jwt.expiration (inyectar por variable de entorno, no commitear secretos)
