server:
  # El gateway es el único puerto público del sistema en la Entrega 1.
  port: 8080
  error:
    # No incluir mensajes de excepción ni stack traces en respuestas HTTP.
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: msvc-gateway
  # E2 (EP-12): Resource Server JWT RS256. El emisor es msvc-usuarios (ADR-0001).
  # Clave/audiencia por variables de entorno (nunca valores hardcoded ni .env).
  # Sin estas variables el JwtDecoder no se construye: fail closed.
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
          audiences: ${JWT_AUDIENCE}
          # `issuer-uri` dispararia discovery OIDC; la validacion de `iss` se
          # configura explicitamente en JwtDecoderValidatorPostProcessor.
          issuer: ${JWT_ISSUER}
  cloud:
    gateway:
      server:
        webmvc:
          # lb:// usa Eureka para elegir una instancia; no fija host ni puerto del servicio.
          routes:
            # Prefijos por rol se declaran antes que los generales.
            - id: admin-usuarios-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/admin/usuarios/**
            - id: admin-artistas-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/admin/artistas/**
            - id: organizador-eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/organizador/eventos/**
            - id: organizador-filas-virtuales-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/organizador/filas-virtuales/**
            - id: admin-eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/admin/eventos/**
            - id: admin-entradas-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/admin/entradas/**
            - id: filas-virtuales-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/filas-virtuales/**
            - id: compras-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/compras/**
            - id: accesos-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/accesos/**
            - id: usuarios-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/usuarios/**
            - id: roles-route
              uri: lb://msvc-usuarios
              predicates:
                - Path=/api/roles/**
            - id: lugares-route
              uri: lb://msvc-ubicacion
              predicates:
                - Path=/api/lugares/**
            - id: sectores-route
              uri: lb://msvc-ubicacion
              predicates:
                - Path=/api/sectores/**
            - id: eventos-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/eventos/**
            - id: artistas-route
              uri: lb://msvc-evento
              predicates:
                - Path=/api/artistas/**
            - id: entradas-route
              uri: lb://msvc-entrada
              predicates:
                # Incluye reservas, acceso y devoluciones bajo /api/entradas.
                - Path=/api/entradas/**
            - id: pagos-route
              uri: lb://msvc-entrada
              predicates:
                - Path=/api/pagos/**
            - id: admin-preferencias-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/admin/preferencias/**
            - id: admin-recomendaciones-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/admin/recomendaciones/**
            - id: preferencias-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/preferencias/**
            - id: recomendaciones-route
              uri: lb://msvc-preferencias
              predicates:
                - Path=/api/recomendaciones/**

# En Entrega 2 la identidad no se toma de headers del cliente: el gateway
# valida el JWT y fija X-User-Id desde el claim idUsuario (ADR-0001).
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

# Las APIs de registros de pago no se exponen públicamente en el gateway.
# Los errores de negocio de los servicios destino se conservan; el gateway solo
# normaliza los errores que genera él mismo, como ruta desconocida o backend caído.
