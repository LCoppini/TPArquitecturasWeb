server:
  port: 8761

spring:
  application:
    name: msvc-eureka

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

# Solo health, sin detalles. El gateway lo deja fuera de la cadena con
# securityMatcher("/api/**", "/internal/**").
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
